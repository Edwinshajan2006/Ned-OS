# ============================================================
# NED CYBERPUNK KITTY
# ============================================================

font_family JetBrains Mono
font_size 13

# Transparency
background_opacity 0.78
dynamic_background_opacity yes

# Window
hide_window_decorations yes
window_padding_width 18

# Cursor
cursor_shape beam
cursor_blink_interval 0.5

# Scrollback
scrollback_lines 10000

# Background / foreground
background #080b18
foreground #e6f1ff

# ============================================================
# CYBERPUNK COLORS
# ============================================================

color0  #080b18
color1  #ff4fa3
color2  #46ffd0
color3  #ffb347
color4  #4da6ff
color5  #c77dff
color6  #19d9ff
color7  #e6f1ff

color8  #3b4659
color9  #ff6db5
color10 #65ffe0
color11 #ffd27a
color12 #70b8ff
color13 #d99cff
color14 #62e8ff
color15 #ffffff

# Tokyo Night theme
include tokyo-night.conf
